<a routerLink="/tasks" class="back-link">← Назад к списку</a>

@if (task) {
  <h2 class="detail-title" [class.task-done]="task.done">{{ task.title }}</h2>

  @if (task.description) {
    <p class="detail-description">{{ task.description }}</p>
  } @else {
    <p class="detail-line">Описание не добавлено</p>
  }

  <p class="detail-line">Статус: {{ task.done ? 'выполнена' : 'в работе' }}</p>
  <p class="detail-line">Номер задачи: {{ task.id }}</p>

  <button class="detail-button" (click)="onToggle()">
    {{ task.done ? 'Вернуть в работу' : 'Отметить выполненной' }}
  </button>
} @else {
  <p class="detail-empty">Такой задачи нет. Возможно, её удалили.</p>
}
